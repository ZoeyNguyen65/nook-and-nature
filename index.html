<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nook & Nature: A tranquil, aesthetic Pomodoro timer and study sanctuary featuring nature backgrounds and integrated music to improve focus.">
  <title>Nook & Nature</title>
  <link rel="icon" type="image/png" href="Images/Nook-&-Nature-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="mountain"><main>
    <div id="main-container">
        <div class="container-1">
            <img src="Images/Nook-&-Nature-logo_white.png" class="dashboard__logo" alt="Nook & Nature - Mindful Study Room Logo" width="115px" height="92.7px">
        </div>

        <div class="container-2">
            <button id="open-settings">Settings</button>
        
            <div id="timer">
                <h2 class="timer__display" id="timer-display">25:00</h2>
                <div class="timer__controls">
                   <button class="timer__btn timer__btn--start" id="start-btn">Start</button>
                   <button class="timer__btn timer__btn--pause" id="pause-btn">Pause</button>
                   <button class="timer__btn timer__btn--reset" id="reset-btn">Reset</button>
                </div>
            </div>
        </div>

        <div class="container-3">
            <div class="media-player" id="spotify-card">
                <iframe title="Spotify Music Player"
                data-testid="embed-iframe"
                class="media-player__widget"
                style="border-radius:20px"
                src="https://open.spotify.com/embed/playlist/37i9dQZF1DWUKPeBypcpcP?utm_source=generator"
                width="100%" height="352" frameBorder="0"
                allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
                </iframe>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden">
        <div class="modal__content">
            <label for="bg-select">Nature Background:</label>
            <select id="bg-select">
              <div id="option-box"><option value="mountain">Mountain Mist</option></div> 
                <option value="forest">Forest Rain</option>
                <option value="river">River Serenade</option>
            </select>

            <label for="timer-input">Set Timer (Minutes):</label>
            <input type="number" id="timer-input" value="25" min="1" max="60">

            <label for="alert-select">Alert Sound:</label>
            <select id="alert-select">
                <option value="ding">Ding</option>
                <option value="chime">Glass Chime</option>
                <option value="bird">Bird Chirp</option>
            </select>

            <div class="save__controls">
                <button class="modal__btn modal__btn--save" id="save-settings">Save Changes</button>
                <button class="modal__btn modal__btn--close" id="close-settings">Close</button>
            </div>
        </div>
    </div>

    <audio id="alert-audio"></audio>
    <script src="index.js"></script>
</main></body>

</html>
